services:
  # ========== БАЗА ДАННЫХ ==========
  db:
    image: postgres:15-alpine
    container_name: todo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-todoapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_network

  # ========== БЭКЕНД ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: todo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-todoapp}
    volumes:
      - ./backend/src:/app/src  # Для разработки (live reload)
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - todo_network

  # ========== ФРОНТЕНД ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: todo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-5000}
    volumes:
      - ./frontend/src:/app/src  # Для разработки (HMR)
      - ./frontend/index.html:/app/index.html
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - todo_network

# ========== СЕТИ И ТОМА ==========
networks:
  todo_network:
    driver: bridge

volumes:
  postgres_data:
    name: todo_postgres_data